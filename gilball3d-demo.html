<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GilBall 3D — Demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0e1a;color:#fff;font-family:Tahoma,sans-serif;overflow:hidden;height:100vh}
  #container{width:100vw;height:100vh;position:relative}
  #hud{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:18px;
    background:rgba(10,15,30,0.85);border:1px solid rgba(255,255,255,0.15);
    border-radius:14px;padding:10px 28px;backdrop-filter:blur(8px)}
  .team{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
  .team .dot{width:14px;height:14px;border-radius:50%;display:inline-block}
  .score{font-size:36px;font-weight:900;letter-spacing:4px;color:#ffcb4d}
  .timer{font-size:14px;color:#93a6c8}
  #goalBanner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
    font-size:80px;font-weight:900;color:#fff;z-index:20;pointer-events:none;
    text-shadow:0 6px 30px rgba(0,0,0,0.5);opacity:0;transition:all 0.4s cubic-bezier(.2,1.4,.3,1)}
  #goalBanner.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  #info{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;
    color:#93a6c8;font-size:13px;background:rgba(10,15,30,0.7);padding:6px 16px;border-radius:8px}
</style>
</head>
<body>
<div id="container"></div>
<div id="hud">
  <div class="team"><span class="dot" style="background:#2196F3"></span><span id="n1">آبی</span></div>
  <div class="score"><span id="s1">۰</span> : <span id="s2">۰</span></div>
  <div class="team"><span id="n2">قرمز</span><span class="dot" style="background:#E6194B"></span></div>
  <div class="timer">⏱ <span id="timer">40.0</span>s</div>
</div>
<div id="goalBanner">⚽ گل!</div>
<div id="info">دمو ۳بعدی بازی گیلبال — بازیکن‌ها به صورت خودکار بازی می‌کنند</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ═══════════════════ GAME SIMULATION (Fake 2D Physics) ═══════════════════ */
const W=1500, H=860, GY=730, GD=122, GH=205, BR=23, PW=66, PH=84;
const GRAVITY=1700, BALL_GRAV=1700, PLAYER_SPEED=385, JUMP_SPEED=-790;
const FPS=60, DT=1/FPS;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

class SimpleEngine {
  constructor(){
    this.reset();
  }
  reset(){
    this.time=40;
    this.score=[0,0];
    this.ball={x:W/2,y:GY-460,vx:(Math.random()-0.5)*120,vy:30};
    this.players=[
      {x:GD+150,y:GY-PH,vx:0,vy:0,face:1,jumpCd:0,kickCd:0},
      {x:W-GD-150-PW,y:GY-PH,vx:0,vy:0,face:-1,jumpCd:0,kickCd:0}
    ];
    this.goalCooldown=0;
  }
  step(){
    if(this.time<=0)return;
    this.time-=DT;
    if(this.goalCooldown>0){this.goalCooldown-=DT;return}

    // AI for players
    this.ai(0, 1);
    this.ai(1, -1);

    // Physics
    for(let p of this.players){
      p.x+=p.vx*DT;
      p.vy+=GRAVITY*DT;
      p.y+=p.vy*DT;
      if(p.y>=GY-PH){p.y=GY-PH;p.vy=0;p.jumpCd=Math.max(0,p.jumpCd-DT)}
      p.x=clamp(p.x,GD,W-GD-PW);
      p.kickCd=Math.max(0,p.kickCd-DT);
    }

    // Ball physics
    let b=this.ball;
    b.vy+=BALL_GRAV*DT;
    b.x+=b.vx*DT;
    b.y+=b.vy*DT;
    b.vx*=0.999;

    // Ground bounce
    if(b.y>=GY-BR){b.y=GY-BR;b.vy=-b.vy*0.58;b.vx*=0.98;if(Math.abs(b.vy)<50)b.vy=0}
    // Ceiling
    if(b.y<BR){b.y=BR;b.vy=Math.abs(b.vy)*0.8}
    // Walls
    if(b.x<BR){b.x=BR;b.vx=Math.abs(b.vx)*0.8}
    if(b.x>W-BR){b.x=W-BR;b.vx=-Math.abs(b.vx)*0.8}

    // Player-ball collision
    for(let i=0;i<2;i++){
      let p=this.players[i];
      let pcx=p.x+PW/2, pcy=p.y+18;
      let dx=b.x-pcx, dy=b.y-pcy;
      let dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<34+BR){
        let nx=dx/dist,ny=dy/dist;
        b.vx+=nx*450+p.vx*0.2;
        b.vy+=ny*350-150;
        b.x=pcx+nx*(34+BR+2);
        b.y=pcy+ny*(34+BR+2);
      }
    }

    // Goals
    if(b.x<GD && b.y>GY-GH && b.y<GY){this.score[1]++;this.goalScored()}
    if(b.x>W-GD && b.y>GY-GH && b.y<GY){this.score[0]++;this.goalScored()}

    // Speed cap
    let spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(spd>1450){b.vx*=1450/spd;b.vy*=1450/spd}
  }
  goalScored(){
    this.ball={x:W/2,y:GY-460,vx:(Math.random()-0.5)*120,vy:30};
    this.goalCooldown=1.5;
    showGoal();
  }
  ai(idx, dir){
    let p=this.players[idx];
    let b=this.ball;
    let bcx=b.x, bcy=b.y;
    let pcx=p.x+PW/2;
    let dist=Math.abs(bcx-pcx);

    // Move toward ball
    if(bcx>pcx+20){p.vx=PLAYER_SPEED;p.face=1}
    else if(bcx<pcx-20){p.vx=-PLAYER_SPEED;p.face=-1}
    else{p.vx*=0.85}

    // Jump if ball is above and near
    if(bcy<GY-PH-60 && dist<200 && p.y>=GY-PH-1 && p.jumpCd<=0){
      p.vy=JUMP_SPEED;
      p.jumpCd=0.5+Math.random()*0.3;
    }

    // Kick
    if(dist<130 && p.kickCd<=0){
      b.vx=dir*850+p.vx*0.5;
      b.vy=-280-Math.random()*200;
      p.kickCd=0.4+Math.random()*0.2;
    }

    // Defensive behavior for player away from ball
    let ownGoalX=idx===0?GD:W-GD;
    if(Math.abs(bcx-ownGoalX)<300 && dist>300){
      p.vx=ownGoalX>pcx?PLAYER_SPEED:-PLAYER_SPEED;
    }
  }
  getFrame(){
    return {
      time:Math.max(0,this.time),
      score:[this.score[0],this.score[1]],
      players:[
        {x:this.players[0].x,y:this.players[0].y,face:this.players[0].face},
        {x:this.players[1].x,y:this.players[1].y,face:this.players[1].face}
      ],
      ball:{x:this.ball.x,y:this.ball.y,vx:this.ball.vx,vy:this.ball.vy}
    };
  }
}

/* ═══════════════════ 3D RENDERER ═══════════════════ */
const S=0.01;
const container=document.getElementById('container');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a2a4a);
scene.fog=new THREE.FogExp2(0x1a2a4a, 0.012);

const camera=new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(W*S/2, 9, 14);
camera.lookAt(W*S/2, 0.8, 0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
container.appendChild(renderer.domElement);

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

/* ─── GROUND ─── */
(function(){
  const c=document.createElement('canvas');c.width=2048;c.height=1024;
  const ctx=c.getContext('2d');
  const sw=c.width/14;
  for(let i=0;i<14;i++){ctx.fillStyle=i%2===0?'#2d8c3e':'#339945';ctx.fillRect(i*sw,0,sw,c.height)}
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=5;
  ctx.strokeRect(30,20,c.width-60,c.height-40);
  ctx.beginPath();ctx.moveTo(c.width/2,20);ctx.lineTo(c.width/2,c.height-20);ctx.stroke();
  ctx.beginPath();ctx.arc(c.width/2,c.height/2,80,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(c.width/2,c.height/2,5,0,Math.PI*2);ctx.fill();
  // Penalty areas
  ctx.strokeRect(30,c.height/2-120,120,240);
  ctx.strokeRect(c.width-150,c.height/2-120,120,240);
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=8;
  const g=new THREE.Mesh(
    new THREE.PlaneGeometry(W*S*1.25,9),
    new THREE.MeshStandardMaterial({map:tex,roughness:0.7,metalness:0.05})
  );
  g.rotation.x=-Math.PI/2;g.position.set(W*S/2,-0.001,0);g.receiveShadow=true;
  scene.add(g);
  // Dark surround
  const o=new THREE.Mesh(
    new THREE.PlaneGeometry(50,30),
    new THREE.MeshStandardMaterial({color:0x0d1a0d,roughness:0.95})
  );
  o.rotation.x=-Math.PI/2;o.position.set(W*S/2,-0.01,0);o.receiveShadow=true;
  scene.add(o);
})();

/* ─── STADIUM STANDS ─── */
(function(){
  const layers=[
    {color:0x1c2844,h:2.5,z:-4.5,w:W*S*1.5},
    {color:0x243358,h:3.5,z:-5.5,w:W*S*1.6},
    {color:0x2c3e6e,h:4.5,z:-6.8,w:W*S*1.7}
  ];
  layers.forEach(l=>{
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(l.w,l.h,1.2),
      new THREE.MeshStandardMaterial({color:l.color,roughness:0.9})
    );
    m.position.set(W*S/2,l.h/2,l.z);scene.add(m);
  });
  // Crowd dots
  const dotCols=[0xffd24d,0x7fe0ff,0xff90a4,0x9dffc4,0xffffff,0xc9a8ff,0xffb066,0x8fb4ff];
  const dg=new THREE.SphereGeometry(0.06,4,4);
  for(let i=0;i<350;i++){
    const dm=new THREE.MeshBasicMaterial({color:dotCols[i%dotCols.length]});
    const d=new THREE.Mesh(dg,dm);
    d.position.set((Math.random()-0.5)*W*S*1.5+W*S/2,0.4+Math.random()*5,-4.2-Math.random()*3);
    scene.add(d);
  }
  // Side walls
  const swm=new THREE.MeshStandardMaterial({color:0x151d35,roughness:0.8});
  [-1.8,W*S+1.8].forEach(x=>{
    const w=new THREE.Mesh(new THREE.BoxGeometry(0.8,5,12),swm);
    w.position.set(x,2.5,0);scene.add(w);
  });
  // Front ad boards
  const adC=[0x12e0c0,0xffd23d,0xff5c8a,0x4db4ff,0xa06bff,0xff9100,0x00e676];
  for(let i=0;i<12;i++){
    const ad=new THREE.Mesh(
      new THREE.BoxGeometry(W*S/12-0.06,0.25,0.1),
      new THREE.MeshBasicMaterial({color:adC[i%adC.length]})
    );
    ad.position.set(W*S*0.04+i*(W*S/12),0.13,4.2);scene.add(ad);
  }
  // Front low wall
  const fw=new THREE.Mesh(
    new THREE.BoxGeometry(W*S*1.3,0.6,0.15),
    new THREE.MeshStandardMaterial({color:0x0d1528})
  );
  fw.position.set(W*S/2,0.3,4.35);scene.add(fw);
})();

/* ─── FLOODLIGHTS ─── */
[W*S*0.18,W*S*0.82].forEach(x=>{
  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(0.06,0.07,9,6),
    new THREE.MeshStandardMaterial({color:0x4a5a78,metalness:0.3})
  );
  pole.position.set(x,4.5,-4.8);scene.add(pole);
  const head=new THREE.Mesh(
    new THREE.BoxGeometry(1.2,0.2,0.4),
    new THREE.MeshStandardMaterial({color:0x39496a})
  );
  head.position.set(x,9.1,-4.8);scene.add(head);
  // Lamp bulbs
  for(let i=0;i<5;i++){
    const bulb=new THREE.Mesh(
      new THREE.SphereGeometry(0.06,6,6),
      new THREE.MeshBasicMaterial({color:0xfffbe0})
    );
    bulb.position.set(x-0.4+i*0.2,9.0,-4.65);scene.add(bulb);
  }
  const sp=new THREE.SpotLight(0xfff8e0,0.5,25,Math.PI/4,0.6);
  sp.position.set(x,9,-4.7);sp.target.position.set(W*S/2,0,0);
  scene.add(sp);scene.add(sp.target);
});

/* ─── GOALS ─── */
function makeGoal(xPos,isRight){
  const g=new THREE.Group();
  const depth=GD*S,height=GH*S,pr=0.045,hw=1.3;
  const pm=new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.6,roughness:0.2});
  // Front posts
  const pg=new THREE.CylinderGeometry(pr,pr,height,8);
  [hw,-hw].forEach(z=>{
    const p=new THREE.Mesh(pg,pm);p.position.set(0,height/2,z);p.castShadow=true;g.add(p);
  });
  // Crossbar
  const cb=new THREE.Mesh(new THREE.CylinderGeometry(pr,pr,hw*2+pr*2,8),pm);
  cb.rotation.x=Math.PI/2;cb.position.set(0,height,0);cb.castShadow=true;g.add(cb);
  // Back frame
  const dir=isRight?1:-1;
  [hw,-hw].forEach(z=>{
    const bp=new THREE.Mesh(pg,pm);bp.position.set(dir*depth,height/2,z);g.add(bp);
  });
  const bcb=new THREE.Mesh(new THREE.CylinderGeometry(pr,pr,hw*2+pr*2,8),pm);
  bcb.rotation.x=Math.PI/2;bcb.position.set(dir*depth,height,0);g.add(bcb);
  // Top connectors
  const cg=new THREE.CylinderGeometry(0.025,0.025,depth,4);
  [hw,-hw].forEach(z=>{
    const c=new THREE.Mesh(cg,pm);c.rotation.z=Math.PI/2;
    c.position.set(dir*depth/2,height,z);g.add(c);
  });
  // Nets (wireframe)
  const nm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.15,side:THREE.DoubleSide,wireframe:true});
  // Back net
  const bn=new THREE.Mesh(new THREE.PlaneGeometry(hw*2,height,10,8),nm);
  bn.rotation.y=Math.PI/2;bn.position.set(dir*depth,height/2,0);g.add(bn);
  // Side nets
  [hw,-hw].forEach(z=>{
    const sn=new THREE.Mesh(new THREE.PlaneGeometry(depth,height,6,8),nm);
    sn.position.set(dir*depth/2,height/2,z);g.add(sn);
  });
  // Top net
  const tn=new THREE.Mesh(new THREE.PlaneGeometry(depth,hw*2,6,10),nm);
  tn.rotation.x=Math.PI/2;tn.position.set(dir*depth/2,height,0);g.add(tn);

  g.position.set(xPos,0,0);scene.add(g);
}
makeGoal(GD*S,false);
makeGoal((W-GD)*S,true);

/* ─── BALL ─── */
const ballGroup=new THREE.Group();
const ballTex=(function(){
  const c=document.createElement('canvas');c.width=256;c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,256,256);
  ctx.fillStyle='#1a2a3d';
  const pent=(cx,cy,r)=>{ctx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;i?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}ctx.closePath();ctx.fill()};
  pent(128,128,34);pent(44,52,26);pent(212,52,26);pent(44,204,26);pent(212,204,26);
  ctx.strokeStyle='#1a2a3d';ctx.lineWidth=3;
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;ctx.beginPath();ctx.moveTo(128+Math.cos(a)*34,128+Math.sin(a)*34);ctx.lineTo(128+Math.cos(a)*105,128+Math.sin(a)*105);ctx.stroke()}
  return new THREE.CanvasTexture(c);
})();
const ballMesh=new THREE.Mesh(
  new THREE.SphereGeometry(BR*S,20,20),
  new THREE.MeshStandardMaterial({map:ballTex,roughness:0.35,metalness:0.05})
);
ballMesh.castShadow=true;
ballGroup.add(ballMesh);
scene.add(ballGroup);

const ballShadow=new THREE.Mesh(
  new THREE.CircleGeometry(BR*S*1.4,16),
  new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.3,depthWrite:false})
);
ballShadow.rotation.x=-Math.PI/2;ballShadow.position.y=0.005;
scene.add(ballShadow);

const ballGlow=new THREE.PointLight(0xff5500,0,5);
scene.add(ballGlow);

// Trail
const trailMeshes=[];
for(let i=0;i<10;i++){
  const tm=new THREE.Mesh(
    new THREE.SphereGeometry(BR*S*(0.8-i*0.06),6,6),
    new THREE.MeshBasicMaterial({color:0xff4422,transparent:true,opacity:0})
  );
  tm.visible=false;scene.add(tm);trailMeshes.push(tm);
}
let prevBall=[];

/* ─── PLAYERS ─── */
const TEAM_COLORS=[new THREE.Color('#2196F3'),new THREE.Color('#E6194B')];
function makePlayer(teamIdx){
  const g=new THREE.Group();
  const col=TEAM_COLORS[teamIdx];
  const dark=col.clone().multiplyScalar(0.65);
  const skinCol=0xffccaa;

  // Head
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.34,16,12),new THREE.MeshStandardMaterial({color:col,roughness:0.45}));
  head.position.y=0.82;head.castShadow=true;g.add(head);

  // Spiky hair
  const spkG=new THREE.ConeGeometry(0.09,0.28,4);
  const spkM=new THREE.MeshStandardMaterial({color:dark,roughness:0.5});
  [{x:0,z:0,r:0},{x:0.14,z:0.06,r:0.35},{x:-0.14,z:0.06,r:-0.35},{x:0.09,z:-0.1,r:0.55},{x:-0.09,z:-0.1,r:-0.55},{x:0,z:-0.12,r:0.15}].forEach(o=>{
    const s=new THREE.Mesh(spkG,spkM);s.position.set(o.x,1.12,o.z);s.rotation.z=o.r;g.add(s);
  });

  // Eyes
  const eG=new THREE.SphereGeometry(0.065,8,8);
  const eM=new THREE.MeshBasicMaterial({color:0x1a1e2a});
  [{x:0.13,z:0.27},{x:-0.09,z:0.27}].forEach(o=>{
    const e=new THREE.Mesh(eG,eM);e.position.set(o.x,0.86,o.z);g.add(e);
    const ew=new THREE.Mesh(new THREE.SphereGeometry(0.035,6,6),new THREE.MeshBasicMaterial({color:0xffffff}));
    ew.position.set(o.x+0.01,0.88,o.z+0.04);g.add(ew);
  });

  // Smile
  const smC=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-0.09,0.70,0.32),new THREE.Vector3(0.03,0.64,0.34),new THREE.Vector3(0.15,0.70,0.32));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(smC,10,0.018,4,false),new THREE.MeshBasicMaterial({color:0x1a1e2a})));

  // Body
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.32,0.30),new THREE.MeshStandardMaterial({color:col,roughness:0.55}));
  body.position.y=0.44;body.castShadow=true;g.add(body);
  // Jersey V
  const jv=new THREE.Mesh(new THREE.PlaneGeometry(0.14,0.16),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.65,side:THREE.DoubleSide}));
  jv.position.set(0.02,0.46,0.151);g.add(jv);

  // Shorts
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.38,0.15,0.28),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.65})),{position:new THREE.Vector3(0,0.23,0)}));

  // Legs
  const lG=new THREE.CylinderGeometry(0.045,0.038,0.2,6);
  const sM=new THREE.MeshStandardMaterial({color:skinCol,roughness:0.5});
  [{x:0.09},{x:-0.09}].forEach(o=>{
    const l=new THREE.Mesh(lG,sM);l.position.set(o.x,0.07,0);g.add(l);
  });

  // Boots
  const bG=new THREE.BoxGeometry(0.11,0.06,0.15);
  const bM=new THREE.MeshStandardMaterial({color:dark,roughness:0.3,metalness:0.2});
  [{x:0.09},{x:-0.09}].forEach(o=>{
    const b=new THREE.Mesh(bG,bM);b.position.set(o.x,-0.02,0.02);g.add(b);
  });

  // Arms
  const aG=new THREE.CylinderGeometry(0.035,0.028,0.24,6);
  const a1=new THREE.Mesh(aG,sM);a1.position.set(0.26,0.42,0);a1.rotation.z=-0.65;g.add(a1);
  const a2=new THREE.Mesh(aG,sM);a2.position.set(-0.26,0.40,0);a2.rotation.z=0.85;g.add(a2);

  // Shadow
  const sh=new THREE.Mesh(new THREE.CircleGeometry(0.38,12),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.22,depthWrite:false}));
  sh.rotation.x=-Math.PI/2;sh.position.y=0.005;g.add(sh);
  g.userData.shadow=sh;

  scene.add(g);
  return g;
}
const playerMeshes=[makePlayer(0),makePlayer(1)];

/* ─── LIGHTING ─── */
scene.add(new THREE.AmbientLight(0xb0c8e8,0.5));
scene.add(new THREE.HemisphereLight(0x87CEEB,0x2d8c3e,0.3));
const dLight=new THREE.DirectionalLight(0xfff5e0,0.9);
dLight.position.set(W*S*0.5,14,7);dLight.target.position.set(W*S*0.5,0,0);
dLight.castShadow=true;
dLight.shadow.camera.left=-14;dLight.shadow.camera.right=14;
dLight.shadow.camera.top=10;dLight.shadow.camera.bottom=-10;
dLight.shadow.mapSize.width=1024;dLight.shadow.mapSize.height=1024;
dLight.shadow.bias=-0.001;
scene.add(dLight);scene.add(dLight.target);

/* ═══════════════════ GAME LOOP ═══════════════════ */
const engine=new SimpleEngine();
let lastGoalScore=[0,0];
const fa=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n){return String(n).replace(/\d/g,d=>fa[d])}

function showGoal(){
  const b=document.getElementById('goalBanner');
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),1600);
}

function updateHUD(f){
  document.getElementById('s1').textContent=toFa(f.score[0]);
  document.getElementById('s2').textContent=toFa(f.score[1]);
  document.getElementById('timer').textContent=f.time.toFixed(1);
}

function update3D(f){
  // Players
  f.players.forEach((p,i)=>{
    const grp=playerMeshes[i];
    grp.position.set((p.x+PW/2)*S, Math.max(0,(GY-p.y-PH)*S), 0);
    grp.rotation.y=p.face>=0?0:Math.PI;
    const h=grp.position.y;
    if(grp.userData.shadow){
      const t=Math.min(h*2.5,1);
      grp.userData.shadow.scale.setScalar(1-t*0.5);
      grp.userData.shadow.material.opacity=0.22*(1-t*0.6);
      grp.userData.shadow.position.y=-h+0.005;
    }
  });

  // Ball
  const bx=f.ball.x*S, by=Math.max(BR*S,(GY-f.ball.y)*S);
  ballGroup.position.set(bx,by,0);
  const vx=f.ball.vx||0,vy=f.ball.vy||0;
  ballMesh.rotation.z-=vx*S*0.07;
  ballMesh.rotation.x+=vy*S*0.05;

  // Ball shadow
  ballShadow.position.set(bx,0.005,0);
  const hNorm=clamp((by-BR*S)/4,0,1);
  ballShadow.scale.setScalar(1-hNorm*0.5);
  ballShadow.material.opacity=0.3*(1-hNorm*0.6);

  // Speed FX
  const speed=Math.sqrt(vx*vx+vy*vy);
  const fx=clamp((speed-250)/1050,0,1);

  if(speed>400){ballGlow.position.set(bx,by,0);ballGlow.intensity=Math.min(3,(speed-400)*0.005);ballGlow.color.setHex(fx>0.6?0xff2200:0xff5500)}
  else{ballGlow.intensity*=0.82}

  // Trail
  prevBall.unshift({x:bx,y:by});
  if(prevBall.length>10)prevBall.length=10;
  trailMeshes.forEach((tm,i)=>{
    if(fx>0.05&&i<prevBall.length){
      tm.visible=true;tm.position.set(prevBall[i].x,prevBall[i].y,0);
      tm.material.opacity=fx*(1-i/trailMeshes.length)*0.4;
    }else{tm.material.opacity*=0.7;if(tm.material.opacity<0.01)tm.visible=false}
  });
}

let lastTime=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  // Step simulation multiple times per render for smoother physics
  for(let i=0;i<3;i++) engine.step();

  const frame=engine.getFrame();
  updateHUD(frame);
  update3D(frame);

  // Auto-restart
  if(frame.time<=0){
    setTimeout(()=>engine.reset(),2000);
  }

  // Gentle camera sway
  camera.position.x=W*S/2+Math.sin(now*0.0003)*0.3;
  camera.position.y=9+Math.sin(now*0.0005)*0.15;

  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

})();
</script>
