<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GilBall 3D Pro — فوتبال کله‌ای سه‌بعدی</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-app">
  <!-- 3D Canvas Viewport -->
  <div id="game-canvas-container"></div>

  <!-- Top Toolbar Left: Settings -->
  <div class="top-controls-left" dir="ltr">
    <select id="select-mode" class="ctrl-select" title="Game Mode">
      <option value="1p_vs_ai">🎮 ۱ نفره (شما vs ربات)</option>
      <option value="ai_vs_ai">🤖 ربات vs ربات</option>
      <option value="2p_local">👥 ۲ نفره (همین کیبورد)</option>
    </select>

    <select id="select-difficulty" class="ctrl-select" title="AI Difficulty">
      <option value="easy">آسان (Easy)</option>
      <option value="normal" selected>متوسط (Normal)</option>
      <option value="pro">حرفه‌ای (Pro AI)</option>
    </select>
  </div>

  <!-- Top Toolbar Right: Camera & Actions -->
  <div class="top-controls" dir="ltr">
    <select id="select-camera" class="ctrl-select" title="Camera Mode">
      <option value="broadcast" selected>📹 دوربین استادیوم</option>
      <option value="follow">🎥 دوربین پویا (Follow)</option>
    </select>

    <select id="select-duration" class="ctrl-select" title="Match Time">
      <option value="30">۳۰ ثانیه</option>
      <option value="60" selected>۶۰ ثانیه</option>
      <option value="90">۹۰ ثانیه</option>
    </select>

    <button id="btn-pause" class="ctrl-btn" title="Pause Game">⏸️</button>
    <button id="btn-restart" class="ctrl-btn" title="Restart Match">🔄</button>
  </div>

  <!-- Center Scorebug & HUD -->
  <div class="top-hud">
    <div class="scoreboard">
      <!-- Team 1 (Blue) -->
      <div class="team-card team-1">
        <span class="team-badge"></span>
        <span class="team-name">تیم آبی</span>
      </div>

      <!-- Score -->
      <div class="score-display">
        <span id="score-team1">0</span>
        <span class="score-colon">:</span>
        <span id="score-team2">0</span>
      </div>

      <!-- Team 2 (Red) -->
      <div class="team-card team-2">
        <span class="team-name">تیم قرمز</span>
        <span class="team-badge"></span>
      </div>

      <!-- Clock -->
      <div class="match-clock">
        ⏱️ <span id="match-timer">60.0s</span>
      </div>
    </div>

    <!-- Super-Shot Power Meters -->
    <div class="super-meters" dir="ltr">
      <div class="meter-wrap" title="قدرت سوپر شوت آبی">
        <div id="super-bar-1" class="meter-fill"></div>
      </div>
      <div class="meter-wrap" title="قدرت سوپر شوت قرمز">
        <div id="super-bar-2" class="meter-fill"></div>
      </div>
    </div>
  </div>

  <!-- Animated Goal Banner -->
  <div id="goal-banner">⚽ گل!</div>

  <!-- Bottom Keyboard Controls Guide -->
  <div class="keyboard-guide" dir="ltr">
    <span><b>حرکت:</b> <span class="key-badge">A</span> <span class="key-badge">D</span> یا <span class="key-badge">⬅️</span> <span class="key-badge">➡️</span></span>
    <span><b>پرش:</b> <span class="key-badge">W</span> یا <span class="key-badge">Space</span></span>
    <span><b>شوت زمینی:</b> <span class="key-badge">J</span> یا <span class="key-badge">X</span></span>
    <span><b>شوت هوایی:</b> <span class="key-badge">K</span> یا <span class="key-badge">C</span></span>
    <span><b>سوپر شوت 🔥:</b> <span class="key-badge">L</span> یا <span class="key-badge">V</span></span>
  </div>

  <!-- Mobile / Touch Controls -->
  <div class="touch-controls">
    <div class="touch-cluster">
      <div id="btn-left" class="touch-btn">◀</div>
      <div id="btn-right" class="touch-btn">▶</div>
    </div>
    <div class="touch-cluster">
      <div id="btn-kick-low" class="touch-btn" style="background:#0288d1">⚡</div>
      <div id="btn-kick-high" class="touch-btn" style="background:#7b1fa2">🚀</div>
      <div id="btn-jump" class="touch-btn" style="background:#388e3c">⬆</div>
      <div id="btn-super" class="touch-btn" style="background:#d32f2f">🔥</div>
    </div>
  </div>

  <!-- Pause Modal -->
  <div id="pause-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">⏸️ بازی متوقف شد</div>
      <p style="color:#90caf9; margin-bottom: 24px;">برای ادامه کلید P یا دکمه زیر را فشار دهید.</p>
      <button class="btn-primary" onclick="window.game.togglePause()">ادامه بازی ▶</button>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="game-over-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="winner-text">🏆 پایان مسابقه</div>
      <div class="modal-score" id="final-score-text">0 : 0</div>
      <button class="btn-primary" onclick="window.game.restartMatch()">بازی مجدد 🔄</button>
    </div>
  </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Game Scripts -->
<script src="src/audio.js"></script>
<script src="src/physics.js"></script>
<script src="src/ai.js"></script>
<script src="src/graphics.js"></script>
<script src="src/game.js"></script>

</body>
</html>
